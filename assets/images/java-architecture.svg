<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" aria-labelledby="javaArchTitle javaArchDesc" role="img">
  <title id="javaArchTitle">Java Virtual Machine (JVM) Architecture &amp; Execution Flow</title>
  <desc id="javaArchDesc">Diagram showing Java Source Code compiling to Bytecode, loaded by ClassLoader into JVM Memory and executed via JIT Compiler.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091a38"/>
      <stop offset="100%" stop-color="#0f2b5c"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Header -->
  <text x="400" y="45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Java Enterprise Runtime &amp; JVM Execution Architecture</text>
  <text x="400" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" text-anchor="middle">From .java Source Code to Hardware Execution via JIT &amp; Garbage Collection</text>
  
  <!-- Step 1: Java Source -->
  <rect x="40" y="110" width="160" height="100" rx="8" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="120" y="145" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1. Java Source Code</text>
  <text x="120" y="170" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">Application.java</text>
  <text x="120" y="190" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">Human-Readable Code</text>
  
  <!-- Arrow 1 -->
  <path d="M 200 160 L 250 160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="225" y="150" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" text-anchor="middle">javac</text>
  
  <!-- Step 2: Bytecode -->
  <rect x="260" y="110" width="160" height="100" rx="8" fill="url(#boxGrad)" stroke="#0284c7" stroke-width="1.5"/>
  <text x="340" y="145" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2. Bytecode</text>
  <text x="340" y="170" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">Application.class</text>
  <text x="340" y="190" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">Platform Independent</text>

  <!-- Arrow 2 -->
  <path d="M 420 160 L 470 160" stroke="#38bdf8" stroke-width="2"/>
  <text x="445" y="150" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" text-anchor="middle">java</text>
  
  <!-- Step 3: JVM Container -->
  <rect x="480" y="100" width="280" height="310" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="620" y="128" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" text-anchor="middle">Java Virtual Machine (JVM)</text>

  <!-- JVM Sub-elements -->
  <rect x="500" y="145" width="240" height="45" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="620" y="172" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Class Loader Subsystem</text>
  
  <rect x="500" y="200" width="240" height="75" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="620" y="222" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">JVM Runtime Data Area</text>
  <text x="560" y="245" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">Method Area</text>
  <text x="670" y="245" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">Heap Memory</text>
  <text x="560" y="265" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">Stack Memory</text>
  <text x="670" y="265" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">PC Registers</text>
  
  <rect x="500" y="285" width="240" height="55" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="620" y="308" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Execution Engine</text>
  <text x="620" y="326" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" text-anchor="middle">Interpreter + JIT Compiler + Garbage Collector (G1 / ZGC)</text>
  
  <rect x="500" y="350" width="240" height="45" rx="6" fill="url(#accentGrad)"/>
  <text x="620" y="378" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Native Machine Code (CPU Execution)</text>

  <!-- Bottom Info Banner -->
  <rect x="40" y="250" width="380" height="160" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="280" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700">Enterprise Java Takeaway:</text>
  <text x="60" y="305" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">• "Write Once, Run Anywhere" enabled by standardized JVM bytecode.</text>
  <text x="60" y="330" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">• JIT converts hotspots into raw assembly for near-C++ velocity.</text>
  <text x="60" y="355" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">• Spring Boot &amp; Hibernate abstract low-level plumbing for microservices.</text>
  <text x="60" y="380" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">• Practical training covers thread dumps, heap profiling &amp; GC tuning.</text>
</svg>
