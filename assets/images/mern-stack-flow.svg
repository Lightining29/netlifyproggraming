<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" aria-labelledby="mernFlowTitle mernFlowDesc" role="img">
  <title id="mernFlowTitle">MERN Full Stack Architecture and Request Flow</title>
  <desc id="mernFlowDesc">Architecture showing React Frontend, Express &amp; Node.js REST API Server, and MongoDB Database with JWT Authentication and Git CI/CD deployment.</desc>
  <defs>
    <linearGradient id="mernBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091a38"/>
      <stop offset="100%" stop-color="#0f2b5c"/>
    </linearGradient>
    <linearGradient id="mernBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" rx="16" fill="url(#mernBg)" stroke="#1e293b" stroke-width="2"/>
  
  <text x="400" y="45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="middle">MERN Full Stack Production Architecture</text>
  <text x="400" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" text-anchor="middle">Seamless Integration of React Client, Node/Express Backend &amp; MongoDB Cluster</text>
  
  <!-- Client (React) -->
  <rect x="50" y="110" width="200" height="230" rx="10" fill="url(#mernBox)" stroke="#61dafb" stroke-width="2"/>
  <text x="150" y="145" fill="#61dafb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle">React (Client UI)</text>
  <text x="150" y="175" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Functional Components</text>
  <text x="150" y="200" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Hooks (useState, useEffect)</text>
  <text x="150" y="225" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• React Router DOM</text>
  <text x="150" y="250" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• State Management / Context</text>
  <text x="150" y="275" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Axios / Fetch Client</text>
  <text x="150" y="310" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">Single Page Application (SPA)</text>

  <!-- Server (Node & Express) -->
  <rect x="300" y="110" width="200" height="230" rx="10" fill="url(#mernBox)" stroke="#68a063" stroke-width="2"/>
  <text x="400" y="145" fill="#68a063" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Node.js + Express</text>
  <text x="400" y="175" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• RESTful Routing Engine</text>
  <text x="400" y="200" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• JWT Authentication</text>
  <text x="400" y="225" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Middleware &amp; CORS</text>
  <text x="400" y="250" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Input Validation (Joi/Zod)</text>
  <text x="400" y="275" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Error Handling Layer</text>
  <text x="400" y="310" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">Asynchronous Event-Driven API</text>

  <!-- Database (MongoDB) -->
  <rect x="550" y="110" width="200" height="230" rx="10" fill="url(#mernBox)" stroke="#47a248" stroke-width="2"/>
  <text x="650" y="145" fill="#47a248" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle">MongoDB (NoSQL)</text>
  <text x="650" y="175" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• BSON Document Storage</text>
  <text x="650" y="200" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Mongoose ODM Schemas</text>
  <text x="650" y="225" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Aggregation Pipelines</text>
  <text x="650" y="250" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Compound Indexing</text>
  <text x="650" y="275" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Sharding &amp; Replication</text>
  <text x="650" y="310" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">Scalable JSON Storage</text>

  <!-- Connectors -->
  <path d="M 250 200 L 300 200" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 300 230 L 250 230" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="275" y="190" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle">HTTP/JSON</text>

  <path d="M 500 200 L 550 200" stroke="#47a248" stroke-width="3"/>
  <path d="M 550 230 L 500 230" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="525" y="190" fill="#47a248" font-family="sans-serif" font-size="10" text-anchor="middle">TCP/BSON</text>

  <!-- Footer Info -->
  <rect x="50" y="365" width="700" height="55" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="400" y="388" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Practical Full Stack Training: Every student deploys an end-to-end multi-tier application with CI/CD on Linux/Cloud.</text>
  <text x="400" y="408" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">In-Person Ghaziabad Center: C-60 R.K Tower, 3rd Floor, RDC • Direct Course Inquiries: 7503962162</text>
</svg>
