<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" aria-labelledby="dsPipeTitle dsPipeDesc" role="img">
  <title id="dsPipeTitle">End-to-End Data Science &amp; Machine Learning Pipeline</title>
  <desc id="dsPipeDesc">Structured workflow from raw data ingestion, preprocessing, EDA, feature engineering, model training, evaluation to production API serving.</desc>
  <defs>
    <linearGradient id="dsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091a38"/>
      <stop offset="100%" stop-color="#0f2b5c"/>
    </linearGradient>
    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" rx="16" fill="url(#dsBg)" stroke="#1e293b" stroke-width="2"/>
  
  <text x="400" y="45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="middle">End-to-End Data Science &amp; ML Engineering Pipeline</text>
  <text x="400" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" text-anchor="middle">Transforming Raw Enterprise Data into Deployed Predictive Intelligence</text>
  
  <!-- Step 1 -->
  <rect x="40" y="110" width="210" height="90" rx="8" fill="url(#stageGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="145" y="140" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1. Ingestion &amp; Storage</text>
  <text x="145" y="165" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">SQL, PostgreSQL, BigQuery</text>
  <text x="145" y="185" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" text-anchor="middle">APIs, S3, CSV, Data Lakes</text>
  
  <!-- Step 2 -->
  <rect x="295" y="110" width="210" height="90" rx="8" fill="url(#stageGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="400" y="140" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. Cleaning &amp; EDA</text>
  <text x="400" y="165" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">Pandas, NumPy DataFrames</text>
  <text x="400" y="185" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" text-anchor="middle">Outlier Removal, Imputation</text>
  
  <!-- Step 3 -->
  <rect x="550" y="110" width="210" height="90" rx="8" fill="url(#stageGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="655" y="140" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3. Feature Engineering</text>
  <text x="655" y="165" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">StandardScaler, One-Hot</text>
  <text x="655" y="185" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" text-anchor="middle">Correlation, PCA, Embeddings</text>
  
  <!-- Step 4 -->
  <rect x="40" y="240" width="210" height="90" rx="8" fill="url(#stageGrad)" stroke="#0284c7" stroke-width="1.5"/>
  <text x="145" y="270" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">4. Model Training</text>
  <text x="145" y="295" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">Scikit-Learn, XGBoost, PyTorch</text>
  <text x="145" y="315" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" text-anchor="middle">Regression, Classification, NLP</text>
  
  <!-- Step 5 -->
  <rect x="295" y="240" width="210" height="90" rx="8" fill="url(#stageGrad)" stroke="#0284c7" stroke-width="1.5"/>
  <text x="400" y="270" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">5. Rigorous Evaluation</text>
  <text x="400" y="295" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">ROC-AUC, F1-Score, RMSE</text>
  <text x="400" y="315" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" text-anchor="middle">Cross-Validation, Drift Check</text>
  
  <!-- Step 6 -->
  <rect x="550" y="240" width="210" height="90" rx="8" fill="url(#stageGrad)" stroke="#0284c7" stroke-width="1.5"/>
  <text x="655" y="270" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">6. Deployment &amp; MLOps</text>
  <text x="655" y="295" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">FastAPI REST Endpoints</text>
  <text x="655" y="315" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" text-anchor="middle">Docker, Model Monitoring</text>
  
  <!-- Bottom Banner -->
  <rect x="40" y="360" width="720" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="400" y="385" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Real Industrial Practice: Our training emphasizes reproducible Jupyter notebooks, production FastAPI wrappers, and rigorous statistical validation.</text>
  <text x="400" y="405" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">Location: C-60 R.K Tower, 3rd Floor, RDC, Ghaziabad • Direct Inquiries: 7503962162</text>
</svg>
