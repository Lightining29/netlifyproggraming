<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" aria-labelledby="seoFlowTitle seoFlowDesc" role="img">
  <title id="seoFlowTitle">Search Engine Optimization (SEO) Crawl, Index &amp; Rank Ecosystem</title>
  <desc id="seoFlowDesc">Diagram illustrating search engine bot discovery, technical crawling (robots.txt, sitemap), rendering and indexing, and algorithmic ranking based on search intent and topical authority.</desc>
  <defs>
    <linearGradient id="seoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091a38"/>
      <stop offset="100%" stop-color="#0f2b5c"/>
    </linearGradient>
    <linearGradient id="seoBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" rx="16" fill="url(#seoBg)" stroke="#1e293b" stroke-width="2"/>
  
  <text x="400" y="45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Search Engine Mechanics: Crawling, Indexing &amp; Ranking</text>
  <text x="400" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" text-anchor="middle">How Search Engines Discover, Understand, and Rank High-Value Technical Content</text>
  
  <!-- Step 1: Crawling -->
  <rect x="40" y="110" width="220" height="230" rx="10" fill="url(#seoBox)" stroke="#38bdf8" stroke-width="2"/>
  <text x="150" y="145" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1. Discovery &amp; Crawling</text>
  <text x="150" y="175" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• robots.txt Directives</text>
  <text x="150" y="200" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• XML Sitemap Discovery</text>
  <text x="150" y="225" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Internal Link Crawl Paths</text>
  <text x="150" y="250" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• HTTP Status Codes (200/301)</text>
  <text x="150" y="275" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Crawl Budget Optimization</text>
  <text x="150" y="310" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">Googlebot / Web Crawlers</text>

  <!-- Step 2: Indexing -->
  <rect x="290" y="110" width="220" height="230" rx="10" fill="url(#seoBox)" stroke="#0284c7" stroke-width="2"/>
  <text x="400" y="145" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle">2. Rendering &amp; Indexing</text>
  <text x="400" y="175" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Headless Chrome Render</text>
  <text x="400" y="200" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Canonical Tag Resolution</text>
  <text x="400" y="225" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Semantic HTML &amp; Headings</text>
  <text x="400" y="250" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• JSON-LD Structured Data</text>
  <text x="400" y="275" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Text Content &amp; Entity Extraction</text>
  <text x="400" y="310" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">Search Engine Database</text>

  <!-- Step 3: Ranking -->
  <rect x="540" y="110" width="220" height="230" rx="10" fill="url(#seoBox)" stroke="#15803d" stroke-width="2"/>
  <text x="650" y="145" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle">3. Intent &amp; Ranking</text>
  <text x="650" y="175" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Search Intent Alignment</text>
  <text x="650" y="200" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Topical Authority &amp; Depth</text>
  <text x="650" y="225" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Core Web Vitals (LCP, INP, CLS)</text>
  <text x="650" y="250" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• Helpful Content System</text>
  <text x="650" y="275" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">• High-Quality Backlink Signals</text>
  <text x="650" y="310" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">Search Engine Results Page (SERP)</text>

  <!-- Arrows -->
  <path d="M 260 220 L 290 220" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 510 220 L 540 220" stroke="#0284c7" stroke-width="3"/>

  <!-- Footer Banner -->
  <rect x="40" y="365" width="720" height="55" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="400" y="388" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Ethical Technical SEO Training: Master real technical audits, Schema.org, Search Console diagnostics, and organic content strategies.</text>
  <text x="400" y="408" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">Physical Center: C-60 R.K Tower, 3rd Floor, RDC, Ghaziabad • Direct Phone: 7503962162</text>
</svg>
